<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Applied Word Podcast — Daily Devotional & Bible</title>
<meta name="description" content="Sharpening the man through the Message. A daily devotional for men, the weekly podcast, and the Berean Standard Bible.">
<meta name="theme-color" content="#1E140C">

<meta property="og:title" content="The Applied Word Podcast">
<meta property="og:description" content="Sharpening the man through the Message. A daily devotional for men.">
<meta property="og:image" content="icons/social-card.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Applied Word">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700;900&family=Lora:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>
<div id="ember"></div>

<header>
  <div class="wordmark">THE <b>APPLIED WORD PODCAST</b></div>
  <div class="streak"><i class="flame"></i> <span id="streakN">0</span> DAYS</div>
</header>

<main id="screen"></main>

<nav>
  <button data-tab="devotion" class="on"><i>&#10022;</i><span>DEVOTION</span></button>
  <button data-tab="bible"><i>&#9636;</i><span>BIBLE</span></button>
  <button data-tab="plans"><i>&#9783;</i><span>Reading Plan</span></button>
  <button data-tab="marks"><i>&#9998;</i><span>MARGIN</span></button>
  <button data-tab="settings"><i>&#9881;</i><span>SETTINGS</span></button>
</nav>

<div id="scrim"></div>
<div id="sheet">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <div class="sref" id="sheetRef">—</div>
    <button id="sheetClose" style="background:transparent;border:0;color:var(--ash);
      font-size:17px;padding:2px 6px;cursor:pointer">&times;</button>
  </div>
  <div class="stext" id="sheetText"></div>

  <div class="swatches">
    <div class="sw" data-c="gold"></div>
    <div class="sw" data-c="rust"></div>
    <div class="sw" data-c="green"></div>
    <div class="sw" data-c="blue"></div>
    <div class="sw" data-c="violet"></div>
    <div class="sw none" data-c="">&#8709;</div>
  </div>

  <div class="sheet-acts">
    <button id="sheetNoteBtn">&#9998; NOTE</button>
    <button id="sheetCardBtn">&#9634; MAKE CARD</button>
    <button id="sheetCopyBtn">&#10064; COPY</button>
  </div>
  <button id="sheetMultiBtn" class="sheet-multi-btn">&#9776; SELECT MORE VERSES</button>

  <textarea id="sheetNote" placeholder="What did you see in this verse?"></textarea>
</div>

<div id="toast"></div>

<script src="content.js"></script>
<script src="mcheyne.js"></script>
<script src="bible.js"></script>
<script src="app.js"></script>
</body>
</html>
