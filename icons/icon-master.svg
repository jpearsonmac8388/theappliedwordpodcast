<text x="512" y="758" text-anchor="middle" fill="url(#gold)" font-family="DejaVu Serif, Georgia, serif" font-size="74" font-weight="700" letter-spacing="2">APPLIED WORD</text>
<text x="512" y="833" text-anchor="middle" fill="#d4b567" font-family="DejaVu Serif, Georgia, serif" font-size="55" font-weight="700" letter-spacing="8">PODCAST</text>
