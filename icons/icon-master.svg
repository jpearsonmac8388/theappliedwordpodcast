<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
  <radialGradient id="bg" cx="50%" cy="16%" r="92%">
    <stop offset="0" stop-color="#553827"/>
    <stop offset=".52" stop-color="#302118"/>
    <stop offset="1" stop-color="#17100c"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f1d995"/>
    <stop offset=".40" stop-color="#c9a75b"/>
    <stop offset=".72" stop-color="#e0bf70"/>
    <stop offset="1" stop-color="#8f6d38"/>
  </linearGradient>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".48" numOctaves="3" seed="19" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
</defs>

<rect width="1024" height="1024" rx="176" fill="url(#bg)"/>
<g filter="url(#grain)"><rect x="42" y="42" width="940" height="940" rx="152" fill="#38261c" opacity=".42"/></g>
<rect x="46" y="46" width="932" height="932" rx="142" fill="none" stroke="url(#gold)" stroke-width="15"/>
<rect x="73" y="73" width="878" height="878" rx="122" fill="none" stroke="#80613a" stroke-width="5" opacity=".78"/>

